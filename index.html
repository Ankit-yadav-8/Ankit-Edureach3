<!DOCTYPE html>

  <head>
    <!-- SPA Redirect (GitHub Pages / Netlify fallback) -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>

    <meta charset="UTF-8" />

    <!-- Primary title: lead with the strongest keyword phrase -->
    <title>CollegeParichay — JEE Rank Predictor, College Reviews & Counselling Guide 2025</title>

    <!-- Keep under 160 chars; front-load keywords Google cares about -->

    <!-- Comma-separated keyword list (secondary signal, still useful for Bing) -->
    <meta name="keywords"
      content="JEE rank predictor, JEE Main rank predictor 2025, JEE Advanced rank predictor, college reviews India, NIT cutoff, IIT cutoff, JoSAA counselling, CSAB counselling, best engineering colleges India, college parichay, college comparison, JEE percentile to rank, JEE Main result 2025" />

    <meta name="publisher" content="CollegeParichay" />

    <!-- Dynamic apple-touch-icon PNG fallback -->

      (function () {
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
          <rect width="180" height="180" rx="20" fill="#F05A28"/>
          <text x="90" y="130" font-family="Arial Black, sans-serif" font-size="98"
            font-weight="900" text-anchor="middle" fill="white">CP</text>
        </svg>`;
        const blob = new Blob([svg], { type: 'image/svg+xml' });
        const url  = URL.createObjectURL(blob);
        const link = document.querySelector('link[rel="apple-touch-icon"]');
        if (link) link.href = url;
      })();
    </script>
