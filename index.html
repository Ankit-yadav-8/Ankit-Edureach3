<!DOCTYPE html>
<html lang="en">
  <head>
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <meta charset="UTF-8" />

    <!-- ✅ Browser Tab Favicon (SVG) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='12' fill='%23F05A28'/><text x='50' y='72' font-family='Arial Black, sans-serif' font-size='54' font-weight='900' text-anchor='middle' fill='white'>CP</text></svg>" />

    <!-- ✅ Apple Touch Icon (PNG generated from SVG via canvas) -->
    <link rel="apple-touch-icon" sizes="180x180" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='12' fill='%23F05A28'/><text x='50' y='72' font-family='Arial Black, sans-serif' font-size='54' font-weight='900' text-anchor='middle' fill='white'>CP</text></svg>" />

    <!-- ✅ Apple PWA Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CollegeParichay" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="College parichay — India's most accurate JEE rank predictor & college discovery platform. Predict JEE Main & Advanced ranks, find colleges, track counselling deadlines."
    />
    <title>CollegeParichay — Know Your Rank. Find Your College.</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#F05A28" />

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- ✅ Dynamically generate apple-touch-icon as PNG for full Apple compatibility -->
    <script>
      (function () {
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
          <rect width="180" height="180" rx="20" fill="#F05A28"/>
          <text x="90" y="130" font-family="Arial Black, sans-serif" font-size="98"
            font-weight="900" text-anchor="middle" fill="white">CP</text>
        </svg>`;
        const blob = new Blob([svg], { type: 'image/svg+xml' });
        const url = URL.createObjectURL(blob);
        const link = document.querySelector('link[rel="apple-touch-icon"]');
        if (link) link.href = url;
      })();
    </script>

    <!-- Google Analytics placeholder -->

  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
